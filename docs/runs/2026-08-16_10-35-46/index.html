<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Tournament] 2026-08-W2 - DNA Tournament top 100</title>
<style>
:root {
  color-scheme: light;
  --ink: #16202a;
  --muted: #5f6f7d;
  --paper: #f7f8f3;
  --panel: #ffffff;
  --line: #d9dfd7;
  --reef: #1f9e89;

}
* { box-sizing: border-box; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
body {

  color: var(--ink);

}
button, input, select { font: inherit; }
.shell { max-width: 1440px; margin: 0 auto; padding: 24px; }
.topbar {

}
h1 {

  letter-spacing: 0;
}

.controls input, .controls select {

}

.summary-item + .summary-item::before { content: "·"; margin: 0 8px; color: #aab2b4; }
.summary-item b { color: #65717a; font-weight: 650; }
.summary-explained { text-decoration: underline dotted #aab2b4; text-underline-offset: 3px; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }

}
.tier-label span { display: block; margin-top: 4px; color: rgba(255,255,255,.78); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; text-align: center; }
.tier-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
.creature-card, .combo-card, .pair-card, .team-row {

  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.creature-card { position: relative; z-index: 0; display: grid; grid-template-columns: 104px 1fr; min-height: 196px; overflow: visible; }

}

.has-tooltip { position: relative; cursor: help; }
.has-tooltip::after {

.has-tooltip:hover::after, .has-tooltip:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
.score-distribution { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); }

.build-line { margin-top: 9px; color: var(--muted); font-size: 11px; line-height: 1.35; }

.omega-steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; }

.omega-ability-list { color: var(--muted); font-size: 10px; line-height: 1.35; }
.mini-ternary { width: 100%; height: 88px; display: block; background: #fbfcf8; }

.mini-ternary text { font-size: 8px; font-weight: 800; letter-spacing: .01em; }
.ternary-health { fill: #2f9d7e; }
.ternary-attack { fill: #b84268; }
.ternary-speed { fill: #2f75b5; }
.stat-icon { width: 1em; height: 1em; flex: 0 0 auto; overflow: visible; color: var(--stat-color, currentColor); fill: currentColor; }
.stat-health { --stat-color: #16895f; }
.stat-attack { --stat-color: #d43d57; }

.stat-armor { --stat-color: #4c91d1; }
.omega-fingerprint { display: grid; gap: 2px; padding: 6px 7px 7px; border-top: 1px solid var(--line); background: #f8faf6; }
.omega-fingerprint-head { display: flex; justify-content: space-between; gap: 4px; color: var(--muted); font-size: 7px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; }

.name { font-weight: 800; overflow-wrap: anywhere; }
.bar { height: 8px; margin: 10px 0 8px; background: #e6eae2; border-radius: 999px; overflow: hidden; }

.combo-list, .pair-list, .team-list { display: grid; gap: 10px; }

.rule-values { position: absolute; z-index: 20; top: calc(100% + 8px); left: 0; width: min(520px, 80vw); max-height: 260px; overflow: auto; padding: 12px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); box-shadow: 0 18px 50px rgba(0,0,0,.35); color: var(--text); font-size: 12px; line-height: 1.55; }

.boost-legend-spreads { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.35; }
.config-list { display: grid; gap: 8px; margin-top: 12px; }
.config-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 9px; background: #fbfcf8; }
.config-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 7px; }
.config-bars span { height: 7px; border-radius: 999px; background: #e6eae2; overflow: hidden; }
.config-bars i { display: block; height: 100%; }
.health { background: #2f9d7e; }
.attack { background: #b84268; }
.speed { background: #2f75b5; }
.detail-note { color: var(--muted); line-height: 1.5; }
.empty { padding: 28px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
@media (max-width: 850px) {
  .shell { padding: 16px; }
  .tier-row { grid-template-columns: 1fr; }
  .tier-label { min-height: 54px; }
  .pair-card, .archetype-main { grid-template-columns: 1fr; }
  .swap-row { grid-template-columns: 1fr; }
  .swap-arrow { text-align: left; }
  section#creatureDetail .detail-top, .boost-layout { grid-template-columns: 1fr; }
  section#creatureDetail .detail-top { min-width: 0; }
  .pair-stats, .archetype-stats { grid-template-columns: repeat(2, minmax(86px, 1fr)); }
  .team-grid { grid-template-columns: repeat(4, minmax(108px, 1fr)); }
  .omega-distribution-row { grid-template-columns: 1fr; gap: 8px; }
  .network-guide { grid-template-columns: 1fr; }
  .analytics-row { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 520px) {
  .shell { padding: 12px; }
  .controls input, .controls select { width: 100%; min-width: 0; max-width: 100%; }
  .tier-cards { grid-template-columns: 1fr; }
  .creature-card { grid-template-columns: 86px 1fr; }
  .creature-visual .portrait, .creature-visual > .missing-img { height: 102px; min-height: 102px; }
  .metric-table { grid-template-columns: 1fr; }
  .metric-cell + .metric-cell { border-left: 0; border-top: 1px solid var(--line); }
  .team-grid { grid-template-columns: repeat(2, minmax(108px, 1fr)); }
  section#creatureDetail .detail-hero { grid-template-columns: 76px minmax(0, 1fr); gap: 10px; }
  .detail-hero .name { font-size: 21px; }
}

      image: (base || seen || {}).image || ""
    };
  }).sort((a, b) => a.name.localeCompare(b.name));
}
function renderTrends() {
  const runs = db.trendRuns || [];
  const creatures = trendCreatures()
    .filter(matchesCreature)
    .map(creature => {
      const rates = runs.map(run => (run.creatures.find(row => row.id === creature.id) || {}).rate || 0);
      const peak = Math.max(...rates, 0);
      const latest = rates[rates.length - 1] || 0;
      return { ...creature, rates, peak, latest };
    })
    .filter(creature => creature.peak > 0)
    .sort((a, b) => b.latest - a.latest || b.peak - a.peak || a.name.localeCompare(b.name))
    .slice(0, 10);
  const palette = shuffledTrendPalette(creatures);
  creatures.forEach((creature, index) => { creature.trendColor = palette[index % palette.length]; });
  if (!runs.length || !creatures.length) {
    document.getElementById("trendList").innerHTML = `<div class="empty">No sibling run data found for this leaderboard.</div>`;
    return;
  }
  const width = 1100;
  const height = 560;
  const pad = { left: 90, right: 90, top: 44, bottom: 112 };
  const maxRate = Math.max(...creatures.flatMap(creature => creature.rates), 0.1);
  const yMax = Math.min(1, Math.max(0.1, Math.ceil(maxRate * 10) / 10));
  const runTimes = runs.map(run => new Date(run.fetchedAt || "").getTime());
  const exactTimeline = runTimes.every(Number.isFinite) && Math.max(...runTimes) > Math.min(...runTimes);
  const minTime = exactTimeline ? Math.min(...runTimes) : 0;
  const timeSpan = exactTimeline ? Math.max(...runTimes) - minTime : 1;
  const x = index => runs.length === 1
    ? (pad.left + width - pad.right) / 2
    : pad.left + (exactTimeline ? (runTimes[index] - minTime) / timeSpan : index / (runs.length - 1)) * (width - pad.left - pad.right);
  const y = rate => height - pad.bottom - (rate / yMax) * (height - pad.top - pad.bottom);
  const grid = [0, .25, .5, .75, 1].map(step => step * yMax);
  const gridLines = grid.map(value => `
    <line x1="${pad.left}" y1="${y(value)}" x2="${width - pad.right}" y2="${y(value)}" stroke="#e3e7df" />
    <text x="12" y="${y(value) + 4}" fill="#5f6f7d" font-size="12">${fmtPct(value)}</text>`).join("");
  const xLabels = runs.map((run, index) => {
    const date = run.fetchedAt ? new Date(run.fetchedAt) : null;
    const label = date && Number.isFinite(date.getTime())
      ? date.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" })
      : run.folder;
    const labelY = height - 74;
    return `<text x="${x(index)}" y="${labelY}" fill="#5f6f7d" font-size="11" text-anchor="end" transform="rotate(-28 ${x(index)} ${labelY})">${safe(label)}</text>
      <text x="${x(index)}" y="${height - 24}" fill="#5f6f7d" font-size="10" text-anchor="middle">${safe(run.teams)} teams</text>`;
  }).join("");
  const lines = creatures.map(creature => {
    const points = creature.rates.map((rate, index) => `${x(index)},${y(rate)}`).join(" ");
    const color = safe(creature.trendColor || "#1f9e89");
    const circles = creature.rates.map((rate, index) => `<circle cx="${x(index)}" cy="${y(rate)}" r="5" fill="${color}" stroke="white" stroke-width="2"><title>${safe(creature.name)}: ${fmtPct(rate)} in ${runs[index].teams} teams at ${safe(runs[index].fetchedAt || runs[index].folder)}</title></circle>`).join("");
    const endpoints = [...new Set([0, creature.rates.length - 1])].map((index, endpointIndex) => {
      if (!creature.image) return "";
      const size = 54;
      const offset = endpointIndex === 0 ? -size - 10 : 10;
      return `<circle cx="${x(index) + offset + size / 2}" cy="${y(creature.rates[index])}" r="${size / 2 + 3}" fill="#fff" stroke="${color}" stroke-width="3"></circle>
        <image href="${safe(creature.image)}" x="${x(index) + offset}" y="${y(creature.rates[index]) - size / 2}" width="${size}" height="${size}" preserveAspectRatio="xMidYMid meet">
          <title>${safe(creature.name)} endpoint</title>
        </image>`;
    }).join("");
    return `<g class="trend-series" data-trend-id="${safe(creature.id)}" role="button" tabindex="0"><polyline fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${points}" />${circles}${endpoints}</g>`;
  }).join("");
  const legend = creatures.map(creature => `<button class="trend-choice" type="button" data-trend-id="${safe(creature.id)}" style="--trend-color:${safe(creature.trendColor || "#1f9e89")}">${img(creature.image, creature.name, "", creature.color)}<span><b>${safe(creature.name)}</b><span>${fmtPct(creature.latest)} latest · click to highlight</span></span></button>`).join("");
  document.getElementById("trendList").innerHTML = `
    <div class="trend-card">
      <svg class="trend-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Creature usage trends over time">
        <rect x="0" y="0" width="${width}" height="${height}" fill="#ffffff"></rect>
        ${gridLines}
        <line x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" stroke="#cbd3c9" />
        ${xLabels}
        ${lines}
      </svg>
      <div class="trend-legend">${legend}</div>
    </div>`;
  document.querySelectorAll("[data-trend-id]").forEach(element => {
    const select = () => {
      const id = element.dataset.trendId || "";
      state.trendCreatureId = state.trendCreatureId === id ? "" : id;
      applyTrendHighlight();
    };
    element.addEventListener("click", select);
    if (element.classList.contains("trend-series")) {
      element.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select(); } });
    }
  });
  applyTrendHighlight();
}
function applyTrendHighlight() {
  const selected = state.trendCreatureId;
  document.querySelectorAll(".trend-series, .trend-choice").forEach(element => {
    const matches = !selected || element.dataset.trendId === selected;
    element.classList.toggle("is-muted", !matches);
    element.classList.toggle("is-selected", Boolean(selected && matches));
  });
}
function render() {
  renderCreatures();
  renderNetwork();
  renderTeams();
  renderTrends();
}
render();
const initialCreatureMatch = location.hash.match(/^#creature=(.+)$/);
if (initialCreatureMatch) openCreatureDetail(decodeURIComponent(initialCreatureMatch[1]), true);
else {
  const initialViewMatch = location.hash.match(/^#view=([a-z]+)$/);
  if (initialViewMatch) showMainView(decodeURIComponent(initialViewMatch[1]), true);
}
</script>
</body>
