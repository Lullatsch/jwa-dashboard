<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Tournament] 2026-08-W3 - AEP Tournament top 100</title>
<style>
:root {
  color-scheme: light;
  --ink: #16202a;
  --muted: #5f6f7d;

}
* { box-sizing: border-box; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
body {

}

}

.ternary-attack { fill: #b84268; }

.name { font-weight: 800; overflow-wrap: anywhere; }

.boost-legend-spreads { margin-top: 5px; color: var(--muted); font-size: 12px; line-height: 1.35; }
.config-list { display: grid; gap: 8px; margin-top: 12px; }
.config-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 9px; background: #fbfcf8; }
.config-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 7px; }
.config-bars span { height: 7px; border-radius: 999px; background: #e6eae2; overflow: hidden; }
.config-bars i { display: block; height: 100%; }
.health { background: #2f9d7e; }
.attack { background: #b84268; }
.speed { background: #2f75b5; }
.detail-note { color: var(--muted); line-height: 1.5; }
.empty { padding: 28px; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
@media (max-width: 850px) {
  .shell { padding: 16px; }
  .tier-row { grid-template-columns: 1fr; }
  .tier-label { min-height: 54px; }
  .pair-card, .archetype-main { grid-template-columns: 1fr; }
  .swap-row { grid-template-columns: 1fr; }
  .swap-arrow { text-align: left; }
  section#creatureDetail .detail-top, .boost-layout { grid-template-columns: 1fr; }
  section#creatureDetail .detail-top { min-width: 0; }
  .pair-stats, .archetype-stats { grid-template-columns: repeat(2, minmax(86px, 1fr)); }
  .team-grid { grid-template-columns: repeat(4, minmax(108px, 1fr)); }
  .omega-distribution-row { grid-template-columns: 1fr; gap: 8px; }
  .network-guide { grid-template-columns: 1fr; }
  .analytics-row { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 520px) {
  .shell { padding: 12px; }
  .controls input, .controls select { width: 100%; min-width: 0; max-width: 100%; }
  .tier-cards { grid-template-columns: 1fr; }
  .creature-card { grid-template-columns: 86px 1fr; }
  .creature-visual .portrait, .creature-visual > .missing-img { height: 102px; min-height: 102px; }
  .metric-table { grid-template-columns: 1fr; }
  .metric-cell + .metric-cell { border-left: 0; border-top: 1px solid var(--line); }
  .team-grid { grid-template-columns: repeat(2, minmax(108px, 1fr)); }
  section#creatureDetail .detail-hero { grid-template-columns: 76px minmax(0, 1fr); gap: 10px; }
  .detail-hero .name { font-size: 21px; }
}

  for (const [value, count] of expanded) {
    midpoint -= count;
    if (midpoint <= 0) { median = value; break; }
  }
  const bars = buckets.map((bucket, index) => {
    const low = Math.round(index * sharedMax / binCount * 10) / 10;
    const high = Math.round((index + 1) * sharedMax / binCount * 10) / 10;
    const rate = bucket.count / Math.max(1, total);
    return `<span class="omega-hist-bar" title="${safe(stat.key)} +${low} to +${high}: ${bucket.count} of ${total} builds (${fmtPct(rate)})"><i style="height:${Math.max(bucket.count ? 4 : 0, rate * 100)}%"></i></span>`;
  }).join("");
  return `<div class="omega-distribution-row ${stat.className}">
    <div class="omega-distribution-label">${statIcon(stat.key)}<div><b>${safe(stat.key)}</b><span>avg +${fmtNum(average)} · median +${fmtNum(median)}</span></div></div>
    <div class="omega-histogram"><div class="omega-hist-bars">${bars}</div><div class="omega-hist-axis"><span>0</span><span>allocated points</span><span>+${sharedMax}</span></div></div>
  </div>`;
}
function renderOmegaUnlockDetail(base, instances) {

      <div><b>${fmtPct(row.rate)}</b><div class="meta">${row.count} of ${instances.length}</div></div>

function showMainView(viewId = "creatures", preserveHash = false) {

  if (!preserveHash) {

function circularEdgesCross(left, right, positions) {
  const [a, b] = left.map(id => positions.get(id)).sort((x, y) => x - y);
  const [c, d] = right.map(id => positions.get(id)).sort((x, y) => x - y);
  if (a === c || a === d || b === c || b === d) return false;
  return (a < c && c < b) !== (a < d && d < b);
}
function circularCrossingCount(order, edges) {
  const positions = new Map(order.map((id, index) => [id, index]));
  let crossings = 0;
  for (let left = 0; left < edges.length; left += 1) {
    for (let right = left + 1; right < edges.length; right += 1) {
      if (circularEdgesCross(edges[left], edges[right], positions)) crossings += 1;
    }
  }
  return crossings;
}
function siftCircularOrder(seed, edges) {
  let order = [...seed];
  let score = circularCrossingCount(order, edges);
  let improved = true;
  while (improved && score > 0) {
    improved = false;
    for (const id of [...order]) {
      const without = order.filter(item => item !== id);
      let bestOrder = order;
      let bestScore = score;
      for (let index = 0; index <= without.length; index += 1) {
        const candidate = [...without.slice(0, index), id, ...without.slice(index)];
        const candidateScore = circularCrossingCount(candidate, edges);
        if (candidateScore < bestScore) {
          bestOrder = candidate;
          bestScore = candidateScore;
        }
      }
      if (bestScore < score) {
        order = bestOrder;
        score = bestScore;
        improved = true;
        if (score === 0) return { order, crossings: 0 };
      }
    }
  }
  return { order, crossings: score };
}
function seededCircularShuffle(ids, seed) {
  const shuffled = [...ids];
  let state = seed >>> 0;
  for (let index = shuffled.length - 1; index > 0; index -= 1) {
    state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
    const target = state % (index + 1);
    [shuffled[index], shuffled[target]] = [shuffled[target], shuffled[index]];
  }
  return shuffled;
}
function crossingMinimizedCircularOrder(ids, edges) {
  if (ids.length < 4 || edges.length < 2) return { order: [...ids], crossings: 0 };
  const degree = new Map(ids.map(id => [id, 0]));
  edges.forEach(([left, right]) => {
    degree.set(left, (degree.get(left) || 0) + 1);
    degree.set(right, (degree.get(right) || 0) + 1);
  });
  const byDegree = [...ids].sort((a, b) => (degree.get(b) - degree.get(a)) || a.localeCompare(b));
  const seeds = [ids, byDegree];
  for (let seed = 1; seed <= 6; seed += 1) seeds.push(seededCircularShuffle(byDegree, seed));
  let best = { order: [...ids], crossings: Number.POSITIVE_INFINITY };
  for (const seed of seeds) {
    const candidate = siftCircularOrder(seed, edges);
    if (candidate.crossings < best.crossings) best = candidate;
    if (best.crossings === 0) break;
  }
  return best;
}
function renderNetwork() {
  const pairs = (data.pairs || []).filter(pair => !pair.exploratory && pair.lift >= 1).slice(0, 30);
  const rawIds = [...new Set(pairs.flatMap(pair => pair.ids))];
  const layout = crossingMinimizedCircularOrder(rawIds, pairs.map(pair => pair.ids));
  const ids = layout.order;
  if (!pairs.length || !ids.length) {
    document.getElementById("networkView").innerHTML = `<div class="empty">No strong creature associations in this snapshot.</div>`;
    return;
  }
  const width = 920, height = 620, cx = width / 2, cy = height / 2, radius = 235;
  const nodes = new Map(ids.map((id, index) => [id, {
    ...db.creatures.get(id), x: cx + Math.cos((index / ids.length) * Math.PI * 2 - Math.PI / 2) * radius,
    y: cy + Math.sin((index / ids.length) * Math.PI * 2 - Math.PI / 2) * radius
  }]));
  const edges = pairs.map((pair, index) => {
    const a = nodes.get(pair.ids[0]), b = nodes.get(pair.ids[1]);
    const dx = b.x - a.x, dy = b.y - a.y, length = Math.max(1, Math.hypot(dx, dy));
    const offset = ((index % 3) - 1) * 12;
    const mx = (a.x + b.x) / 2 + (-dy / length) * offset;
    const my = (a.y + b.y) / 2 + (dx / length) * offset;
    return `<g><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#1f9e89" stroke-linecap="round" stroke-opacity="${Math.min(.85, .2 + (pair.lift - 1) * .55)}" stroke-width="${1 + pair.count / 2}"><title>${safe(pair.names.join(" + "))}: ${pair.count} teams, ${fmtNum(pair.lift)}x lift</title></line><text class="edge-label" x="${mx}" y="${my}" text-anchor="middle">${pair.count} · ${fmtNum(pair.lift)}x</text></g>`;
  }).join("");
  const circles = [...nodes.values()].map((node, index) => {
    const r = 12 + 24 * Math.sqrt(node.rate || 0);
    const clipId = `node-clip-${index}`;
    const portrait = node.image
      ? `<image class="network-node-image" href="${safe(node.image)}" x="${node.x - r}" y="${node.y - r}" width="${r * 2}" height="${r * 2}" preserveAspectRatio="xMidYMid meet" clip-path="url(#${clipId})"></image>`
      : `<text x="${node.x}" y="${node.y + 4}" text-anchor="middle" font-size="11" font-weight="900">${safe(String(node.name || "?").slice(0, 2).toUpperCase())}</text>`;
    return `<g><defs><clipPath id="${clipId}"><circle cx="${node.x}" cy="${node.y}" r="${r - 3}"></circle></clipPath></defs><circle cx="${node.x}" cy="${node.y}" r="${r}" fill="#eef1ec" stroke="${safe(node.color || "#26324a")}" stroke-width="4"><title>${safe(node.name)}: ${fmtPct(node.rate || 0)} usage</title></circle>${portrait}<circle cx="${node.x}" cy="${node.y}" r="${r}" fill="transparent" stroke="${safe(node.color || "#26324a")}" stroke-width="4"><title>${safe(node.name)}: ${fmtPct(node.rate || 0)} usage</title></circle><text x="${node.x}" y="${node.y + r + 16}" text-anchor="middle" font-size="11" font-weight="800">${safe(node.name)}</text><text x="${node.x}" y="${node.y + r + 31}" text-anchor="middle" font-size="11" fill="#5f6f7d">${fmtPct(node.rate || 0)} usage</text></g>`;
  }).join("");
  document.getElementById("networkView").innerHTML = `<div class="network-card">
    <div class="combo-head"><strong>Supported selection associations</strong><span class="meta">Labels show teams · lift</span></div>
    <div class="network-guide">
      <div><b>Node size = usage</b>Larger creatures appear in a greater share of teams. Exact usage is printed under every node.</div>
      <div><b>Edge width = teams</b>Thicker links appear in more teams. The first number is the team count.</div>
      <div><b>Edge opacity = lift</b>Darker links indicate a stronger association. The second number is lift.</div>
    </div>
    <svg class="network-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Creature selection association network">${edges}${circles}</svg>
    <div class="detail-note">Associations do not prove battle synergy.</div>
  </div>`;
}
function teamMatches(team) {
  if (!state.q && state.rarity === "all") return true;
  return team.creatures.some(item => matchesCreature(item));
}
function loadoutCard(item, rules = null) {
  rules = rules || data.displayRules || { levels: true, boosts: true, enhancements: true };
  const enhancement = Math.max(0, Number(item.enhancements ?? item.powerLevel ?? 0));
  const boost = label => Math.max(0, Number(item.boosts?.[label] ?? 0));
  const unlocked = (item.omegaUnlocks || []).filter(row => row.unlocked);
  const stats = [];
  if (rules.levels) stats.push(`<span class="loadout-stat" title="Level">${fmtNum(item.level)}</span>`);
  if (rules.boosts) stats.push(
    statValue("Health", boost("Health"), "Health boosts"),
    statValue("Attack", boost("Attack"), "Attack boosts"),
    statValue("Speed", boost("Speed"), "Speed boosts")
  );
  const omegaStats = item.rarity === "Omega" && rules.boosts
    ? OMEGA_STATS.map(stat => `<span class="omega-loadout-stat ${stat.className}" title="Omega ${safe(stat.key)} allocation">${statIcon(stat.key)}<span>${fmtNum(Number(item.stats?.[stat.key] ?? 0))}</span></span>`).join("")
    : "";
  return `<div class="loadout-card" style="--rarity:${safe(item.color)}">
    ${rules.enhancements && enhancement > 0 ? `<div class="enhancement-badge" title="Enhancements">${fmtNum(enhancement)}</div>` : ""}
    ${img(item.image, item.name, "loadout-portrait", item.color)}
    ${stats.length ? `<div class="loadout-stats" style="grid-template-columns:repeat(${stats.length},1fr)" aria-label="Creature build">${stats.join("")}</div>` : ""}
    ${omegaStats ? `<div class="omega-loadout-stats" aria-label="Omega training allocation">${omegaStats}</div>` : ""}
    ${unlocked.length ? `<div class="loadout-stats" title="Omega abilities unlocked"><span class="loadout-stat" style="grid-column:1/-1">Ω ${unlocked.length} · L${unlocked[unlocked.length - 1].level}</span></div>` : ""}
    <div class="loadout-name">${safe(item.name)}</div>
  </div>`;
}
function renderTeams() {
  const rows = data.teams.filter(teamMatches);
  const patterns = new Map();
  for (const team of rows) {
    const creatures = [...(team.creatures || [])].sort((a, b) => a.name.localeCompare(b.name) || a.id.localeCompare(b.id));
    const signature = creatures.map(item => item.id).sort().join("|");
    if (!patterns.has(signature)) patterns.set(signature, { count: 0, start: Number(team.rankBandStart ?? 999999), rankBands: new Set(), creatures });
    const pattern = patterns.get(signature);
    pattern.count += 1;
    pattern.start = Math.min(pattern.start, Number(team.rankBandStart ?? 999999));
    pattern.rankBands.add(team.rankBand || "Unranked");
  }
  const unique = [...patterns.values()].sort((a, b) => a.start - b.start || b.count - a.count).slice(0, 24);
  document.getElementById("teamList").innerHTML = unique.length ? `
    <div class="notice team-intro">Identical eight-creature rosters are grouped regardless of slot order.</div>
    ${unique.map(pattern => `<article class="team-row">
      <div class="team-pattern-head"><b>${pattern.count} ${pattern.count === 1 ? "team" : "teams"}</b><span class="meta">Ranks ${safe([...pattern.rankBands].join(", "))}</span></div>
      <div class="team-grid">${pattern.creatures.map(item => loadoutCard(item)).join("")}</div>
    </article>`).join("")}
    ${patterns.size > unique.length ? `<div class="detail-note">Showing the 24 highest-ranked unique roster patterns out of ${patterns.size}.</div>` : ""}`
    : `<div class="empty">No teams match the current filters.</div>`;
}
function trendCreatures() {
  const ids = new Set();
  data.popularity.slice(0, 16).forEach(item => ids.add(item.id));
  return [...ids].map(id => {
    const base = db.creatures.get(id);
    const seen = db.trendRuns.flatMap(run => run.creatures).find(item => item.id === id);
    return {
      id,
      name: (base || seen || {}).name || id.slice(0, 8),
      internalName: (base || {}).internalName || "",
      rarity: (base || {}).rarity || "",
      color: (base || seen || {}).color || "",
      image: (base || seen || {}).image || ""
    };
  }).sort((a, b) => a.name.localeCompare(b.name));
}
function renderTrends() {
  const runs = db.trendRuns || [];
  const creatures = trendCreatures()
    .filter(matchesCreature)
    .map(creature => {
      const rates = runs.map(run => (run.creatures.find(row => row.id === creature.id) || {}).rate || 0);
      const peak = Math.max(...rates, 0);
      const latest = rates[rates.length - 1] || 0;
      return { ...creature, rates, peak, latest };
    })
    .filter(creature => creature.peak > 0)
    .sort((a, b) => b.latest - a.latest || b.peak - a.peak || a.name.localeCompare(b.name))
    .slice(0, 10);

  creatures.forEach((creature, index) => { creature.trendColor = palette[index % palette.length]; });
  if (!runs.length || !creatures.length) {
    document.getElementById("trendList").innerHTML = `<div class="empty">No sibling run data found for this leaderboard.</div>`;
    return;
  }
  const width = 1100;
  const height = 560;
  const pad = { left: 90, right: 90, top: 44, bottom: 112 };
  const maxRate = Math.max(...creatures.flatMap(creature => creature.rates), 0.1);
  const yMax = Math.min(1, Math.max(0.1, Math.ceil(maxRate * 10) / 10));
  const runTimes = runs.map(run => new Date(run.fetchedAt || "").getTime());
  const exactTimeline = runTimes.every(Number.isFinite) && Math.max(...runTimes) > Math.min(...runTimes);
  const minTime = exactTimeline ? Math.min(...runTimes) : 0;
  const timeSpan = exactTimeline ? Math.max(...runTimes) - minTime : 1;
  const x = index => runs.length === 1
    ? (pad.left + width - pad.right) / 2
    : pad.left + (exactTimeline ? (runTimes[index] - minTime) / timeSpan : index / (runs.length - 1)) * (width - pad.left - pad.right);
  const y = rate => height - pad.bottom - (rate / yMax) * (height - pad.top - pad.bottom);
  const grid = [0, .25, .5, .75, 1].map(step => step * yMax);
  const gridLines = grid.map(value => `
    <line x1="${pad.left}" y1="${y(value)}" x2="${width - pad.right}" y2="${y(value)}" stroke="#e3e7df" />
    <text x="12" y="${y(value) + 4}" fill="#5f6f7d" font-size="12">${fmtPct(value)}</text>`).join("");
  const xLabels = runs.map((run, index) => {
    const date = run.fetchedAt ? new Date(run.fetchedAt) : null;
    const label = date && Number.isFinite(date.getTime())
      ? date.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" })
      : run.folder;
    const labelY = height - 74;
    return `<text x="${x(index)}" y="${labelY}" fill="#5f6f7d" font-size="11" text-anchor="end" transform="rotate(-28 ${x(index)} ${labelY})">${safe(label)}</text>
      <text x="${x(index)}" y="${height - 24}" fill="#5f6f7d" font-size="10" text-anchor="middle">${safe(run.teams)} teams</text>`;
  }).join("");
  const lines = creatures.map(creature => {
    const points = creature.rates.map((rate, index) => `${x(index)},${y(rate)}`).join(" ");
    const color = safe(creature.trendColor || "#1f9e89");
    const circles = creature.rates.map((rate, index) => `<circle cx="${x(index)}" cy="${y(rate)}" r="5" fill="${color}" stroke="white" stroke-width="2"><title>${safe(creature.name)}: ${fmtPct(rate)} in ${runs[index].teams} teams at ${safe(runs[index].fetchedAt || runs[index].folder)}</title></circle>`).join("");
    const endpoints = [...new Set([0, creature.rates.length - 1])].map((index, endpointIndex) => {
      if (!creature.image) return "";
      const size = 54;
      const offset = endpointIndex === 0 ? -size - 10 : 10;
      return `<circle cx="${x(index) + offset + size / 2}" cy="${y(creature.rates[index])}" r="${size / 2 + 3}" fill="#fff" stroke="${color}" stroke-width="3"></circle>
        <image href="${safe(creature.image)}" x="${x(index) + offset}" y="${y(creature.rates[index]) - size / 2}" width="${size}" height="${size}" preserveAspectRatio="xMidYMid meet">
          <title>${safe(creature.name)} endpoint</title>
        </image>`;
    }).join("");
    return `<g class="trend-series" data-trend-id="${safe(creature.id)}" role="button" tabindex="0"><polyline fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${points}" />${circles}${endpoints}</g>`;
  }).join("");
  const legend = creatures.map(creature => `<button class="trend-choice" type="button" data-trend-id="${safe(creature.id)}" style="--trend-color:${safe(creature.trendColor || "#1f9e89")}">${img(creature.image, creature.name, "", creature.color)}<span><b>${safe(creature.name)}</b><span>${fmtPct(creature.latest)} latest · click to highlight</span></span></button>`).join("");
  document.getElementById("trendList").innerHTML = `
    <div class="trend-card">
      <svg class="trend-svg" viewBox="0 0 ${width} ${height}" role="img" aria-label="Creature usage trends over time">
        <rect x="0" y="0" width="${width}" height="${height}" fill="#ffffff"></rect>
        ${gridLines}
        <line x1="${pad.left}" y1="${height - pad.bottom}" x2="${width - pad.right}" y2="${height - pad.bottom}" stroke="#cbd3c9" />
        ${xLabels}
        ${lines}
      </svg>
      <div class="trend-legend">${legend}</div>
    </div>`;
  document.querySelectorAll("[data-trend-id]").forEach(element => {
    const select = () => {
      const id = element.dataset.trendId || "";
      state.trendCreatureId = state.trendCreatureId === id ? "" : id;
      applyTrendHighlight();
    };
    element.addEventListener("click", select);
    if (element.classList.contains("trend-series")) {
      element.addEventListener("keydown", event => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select(); } });
    }
  });
  applyTrendHighlight();
}
function applyTrendHighlight() {
  const selected = state.trendCreatureId;
  document.querySelectorAll(".trend-series, .trend-choice").forEach(element => {
    const matches = !selected || element.dataset.trendId === selected;
    element.classList.toggle("is-muted", !matches);
    element.classList.toggle("is-selected", Boolean(selected && matches));
  });
}
function render() {
  renderCreatures();
  renderNetwork();
  renderTeams();
  renderTrends();
}
render();
const initialCreatureMatch = location.hash.match(/^#creature=(.+)$/);

else {
  const initialViewMatch = location.hash.match(/^#view=([a-z]+)$/);
